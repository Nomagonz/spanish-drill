<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mic diagnostic</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1E2B26;color:#ECE5D3;font:14px/1.5 ui-monospace,Menlo,monospace;padding:16px;padding-bottom:60px}
h1{font-size:16px;margin-bottom:4px}
.sub{color:#8FA096;font-size:12px;margin-bottom:14px}
.env{background:#2B3B34;border:1px solid #3C4F47;border-radius:3px;padding:10px;font-size:12px;margin-bottom:14px;word-break:break-word}
.env b{color:#E19B33}
button{display:block;width:100%;font:600 13px/1.3 ui-monospace,Menlo,monospace;text-align:left;
  padding:15px 14px;margin-bottom:9px;border-radius:3px;border:1px solid #3C4F47;background:#2B3B34;color:#ECE5D3}
button small{display:block;font-weight:400;color:#8FA096;margin-top:4px;font-size:11px}
button:disabled{opacity:.5}
#log{background:#0F1613;border:1px solid #3C4F47;border-radius:3px;padding:10px;font-size:11.5px;
  white-space:pre-wrap;word-break:break-word;min-height:150px;margin-top:6px}
.ok{color:#6E9A6B}.bad{color:#C24B36}.hi{color:#E19B33}
#clear{background:transparent;color:#8FA096;text-align:center;font-weight:400}
</style>
</head>
<body>
<h1>Mic diagnostic</h1>
<div class="sub">BUILD 3 &middot; run the tests top to bottom, then send a screenshot of the log.</div>
<div class="env" id="env"></div>

<button id="a">A &mdash; speech recognition, nothing else
  <small>No AudioContext. No getUserMedia. The cleanest possible attempt.</small></button>
<button id="b">B &mdash; mic permission first, then speech
  <small>Asks for the mic via getUserMedia, releases it, then listens.</small></button>
<button id="c">C &mdash; AudioContext running, then speech
  <small>Starts the sound engine first, like the real app does.</small></button>
<button id="d">D &mdash; can the browser hear ANY sound?
  <small>Pure level meter. Proves the mic itself works, no speech engine.</small></button>
<button id="clear">clear log</button>
<div id="log">ready.</div>

<script>
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var logEl = document.getElementById("log"), t0 = 0;
function log(m, cls){
  var dt = t0 ? "+" + ((Date.now()-t0)/1000).toFixed(2) + "s " : "";
  logEl.innerHTML += "\n" + dt + (cls ? '<span class="'+cls+'">'+m+'</span>' : m);
  logEl.scrollTop = logEl.scrollHeight;
}
document.getElementById("clear").onclick = function(){ logEl.textContent = "ready."; };

document.getElementById("env").innerHTML =
  "<b>SpeechRecognition:</b> " + (SR ? "present" : "MISSING") +
  "<br><b>secure origin:</b> " + window.isSecureContext +
  "<br><b>getUserMedia:</b> " + !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) +
  "<br><b>UA:</b> " + navigator.userAgent;

// Wire every event the recognizer can emit, so nothing fails silently.
function runSR(tag){
  if(!SR){ log("no SpeechRecognition on this browser","bad"); return; }
  var r;
  try{ r = new SR(); }catch(e){ log("could not construct: "+e,"bad"); return; }
  r.lang = "es-MX"; r.interimResults = true; r.maxAlternatives = 5; r.continuous = false;
  var got = false;
  ["audiostart","soundstart","speechstart","speechend","soundend","audioend"].forEach(function(ev){
    r["on"+ev] = function(){ log("  ."+ev); };
  });
  r.onstart  = function(){ log(tag+" started — SAY SOMETHING IN SPANISH","hi"); };
  r.onresult = function(e){
    for(var i=e.resultIndex;i<e.results.length;i++){
      var res = e.results[i];
      log((res.isFinal?"FINAL: ":"interim: ") + res[0].transcript, res.isFinal?"ok":null);
      if(res.isFinal) got = true;
    }
  };
  r.onerror  = function(e){ log("ERROR: " + e.error + (e.message?" — "+e.message:""), "bad"); };
  r.onend    = function(){ log(got ? "ended (heard you)" : "ended with NO result", got?"ok":"bad"); };
  try{ r.start(); log(tag+" .start() called"); }
  catch(e){ log("start() threw: "+e, "bad"); }
  setTimeout(function(){ try{ r.stop(); }catch(e){} }, 8000);
}

document.getElementById("a").onclick = function(){
  t0 = Date.now(); log("\n=== TEST A: speech only ===","hi"); runSR("A");
};

document.getElementById("b").onclick = function(){
  t0 = Date.now(); log("\n=== TEST B: getUserMedia first ===","hi");
  log("requesting mic…");
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
    log("mic granted, releasing tracks","ok");
    s.getTracks().forEach(function(t){ t.stop(); });
    runSR("B");
  }).catch(function(e){ log("getUserMedia failed: "+e.name+" — "+e.message,"bad"); });
};

document.getElementById("c").onclick = function(){
  t0 = Date.now(); log("\n=== TEST C: AudioContext first ===","hi");
  try{
    var AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state === "suspended") AC.resume();
    log("AudioContext state: " + AC.state);
  }catch(e){ log("AudioContext failed: "+e,"bad"); }
  runSR("C");
};

// D proves the microphone hardware works even if the speech engine never does.
document.getElementById("d").onclick = function(){
  t0 = Date.now(); log("\n=== TEST D: raw level meter ===","hi");
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
    log("mic granted — MAKE NOISE for 6 seconds","hi");
    var AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state === "suspended") AC.resume();
    var an = AC.createAnalyser(); an.fftSize = 512;
    AC.createMediaStreamSource(s).connect(an);
    var buf = new Uint8Array(an.frequencyBinCount), peak = 0, n = 0;
    var iv = setInterval(function(){
      an.getByteTimeDomainData(buf);
      var p = 0;
      for(var i=0;i<buf.length;i++){ var v = Math.abs(buf[i]-128)/128; if(v>p) p=v; }
      if(p>peak) peak = p;
      if(++n % 10 === 0) log("  level now " + p.toFixed(3) + ", peak " + peak.toFixed(3));
    }, 100);
    setTimeout(function(){
      clearInterval(iv);
      s.getTracks().forEach(function(t){ t.stop(); });
      try{ AC.close(); }catch(e){}
      log(peak > 0.02 ? "MIC HARDWARE WORKS — peak " + peak.toFixed(3) : "SILENT — peak " + peak.toFixed(3) + ", browser got no audio", peak > 0.02 ? "ok" : "bad");
    }, 6000);
  }).catch(function(e){ log("getUserMedia failed: "+e.name+" — "+e.message,"bad"); });
};
</script>
</body>
</html>
